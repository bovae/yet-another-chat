<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>💬</text></svg>">
  <title>Room Catalog - YAC</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/chat.css}">
</head>
<body class="d-flex flex-column vh-100">

  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <div class="container mt-4">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="mb-0">Public Room Catalog</h4>
          <a th:href="@{/rooms/create}" class="btn btn-primary btn-sm">Create Room</a>
        </div>

        <form th:action="@{/rooms/catalog}" method="get" class="mb-4">
          <div class="input-group">
            <input type="text" class="form-control" name="search" placeholder="Search rooms..."
                   th:value="${search}">
            <button class="btn btn-outline-secondary" type="submit">Search</button>
          </div>
        </form>

        <div th:if="${catalog.isEmpty()}" class="text-center text-muted py-5">
          <p>No public rooms found.</p>
          <a th:href="@{/rooms/create}" class="btn btn-outline-primary btn-sm">Create the first room</a>
        </div>

        <div class="list-group">
          <div th:each="entry : ${catalog}" class="list-group-item d-flex justify-content-between align-items-center">
            <div>
              <a th:href="@{/chat/rooms/{id}(id=${entry.id()})}" class="text-decoration-none">
                <h6 class="mb-1" th:text="${entry.name()}">Room Name</h6>
                <p class="mb-0 small text-muted" th:text="${entry.description() ?: 'No description'}">Description</p>
              </a>
            </div>
            <div class="d-flex align-items-center gap-2">
              <span class="badge bg-secondary" th:text="${entry.memberCount()} + ' members'">0 members</span>
              <span th:if="${joinedRoomIds.contains(entry.id())}" class="badge bg-success">Joined</span>
              <form th:unless="${joinedRoomIds.contains(entry.id())}" th:action="@{/rooms/{id}/join(id=${entry.id()})}" method="post" style="display:inline">
                <button type="submit" class="btn btn-outline-primary btn-sm">Join</button>
              </form>
            </div>
          </div>
        </div>

        <!-- Pagination -->
        <nav th:if="${catalog.totalPages > 1}" class="mt-3" aria-label="Catalog pagination">
          <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${catalog.first} ? 'disabled'">
              <a class="page-link" th:href="@{/rooms/catalog(search=${search}, page=${catalog.number - 1})}">Previous</a>
            </li>
            <li th:each="i : ${#numbers.sequence(0, catalog.totalPages - 1)}"
                class="page-item" th:classappend="${i == catalog.number} ? 'active'">
              <a class="page-link" th:href="@{/rooms/catalog(search=${search}, page=${i})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${catalog.last} ? 'disabled'">
              <a class="page-link" th:href="@{/rooms/catalog(search=${search}, page=${catalog.number + 1})}">Next</a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>

  <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
