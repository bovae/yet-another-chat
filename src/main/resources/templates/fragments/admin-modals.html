<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<div th:fragment="admin-modals(room)">

  <!-- Invite User Modal -->
  <div class="modal fade" id="inviteModal" tabindex="-1" aria-labelledby="inviteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="inviteModalLabel">Invite User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="invite-username" class="form-label">Username</label>
            <input type="text" class="form-control" id="invite-username" placeholder="Enter username">
          </div>
          <div id="invite-feedback" class="small"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary btn-sm" onclick="sendInvitation()">Send Invitation</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Banned Users Modal -->
  <div class="modal fade" id="bannedUsersModal" tabindex="-1" aria-labelledby="bannedUsersModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="bannedUsersModalLabel">Banned Users</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="banned-users-list">
            <p class="text-muted small">Loading...</p>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Room Settings Modal -->
  <div class="modal fade" id="roomSettingsModal" tabindex="-1" aria-labelledby="roomSettingsModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="roomSettingsModalLabel">Room Settings</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="room-settings-form">
            <div class="mb-3">
              <label for="room-settings-name" class="form-label">Name</label>
              <input type="text" class="form-control" id="room-settings-name"
                     th:value="${room.name}" placeholder="Room name">
            </div>
            <div class="mb-3">
              <label for="room-settings-description" class="form-label">Description</label>
              <textarea class="form-control" id="room-settings-description" rows="3"
                        th:text="${room.description}" placeholder="Room description"></textarea>
            </div>
            <div class="mb-3">
              <label for="room-settings-visibility" class="form-label">Visibility</label>
              <select class="form-select" id="room-settings-visibility">
                <option th:each="v : ${T(com.bovae.yac.model.enums.RoomVisibility).values()}"
                        th:value="${v.name()}"
                        th:text="${v.name()}"
                        th:selected="${v == room.visibility}">
                </option>
              </select>
            </div>
            <div id="roomSettingsError" class="text-danger small"></div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary btn-sm" onclick="submitRoomSettings()">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Room Confirmation Modal -->
  <div class="modal fade" id="deleteRoomModal" tabindex="-1" aria-labelledby="deleteRoomModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title text-danger" id="deleteRoomModalLabel">Delete Room</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>Are you sure you want to delete <strong th:text="${room.name}">Room</strong>?</p>
          <p class="text-muted small">This action is irreversible. All messages, attachments, and members will be removed.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger btn-sm" onclick="deleteRoom()">Delete Room</button>
        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
