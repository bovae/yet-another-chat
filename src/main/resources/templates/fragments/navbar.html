<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-3">
  <a class="navbar-brand fw-bold" th:href="@{/}">YAC</a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNav">
    <!-- Navbar carries only global, cross-page destinations (R5-17). Rooms and contacts live in the
         always-present sidebar, so the old "Private Rooms"/"Contacts" section-anchor links (which
         merely scrolled a sidebar section) were dropped; "Saved Messages" is promoted here as a
         one-click destination reachable from any page. -->
    <ul class="navbar-nav me-auto">
      <li class="nav-item">
        <a class="nav-link" th:classappend="${activePath != null and activePath.startsWith('/rooms/catalog')} ? 'active'"
           th:href="@{/rooms/catalog}">Browse rooms</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" th:classappend="${activePath != null and activePath.startsWith('/chat/saved-messages')} ? 'active'"
           th:href="@{/chat/saved-messages}">Saved Messages</a>
      </li>
    </ul>
    <!-- Aggregate notification badge, visible on pages without the sidebar (R3-10) -->
    <a th:if="${navbarUser != null}" class="nav-link position-relative me-3" th:href="@{/chat}"
       id="navbar-notif" title="Notifications" aria-label="Notifications">
      🔔
      <span id="navbar-notif-badge"
            class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle d-none">0</span>
    </a>
    <!-- Avatar dropdown for authenticated users -->
    <div th:if="${navbarUser != null}" class="dropdown">
      <a class="d-flex align-items-center text-decoration-none dropdown-toggle"
         href="#" role="button" id="navbarUserDropdown"
         data-bs-toggle="dropdown" aria-expanded="false">
        <div class="d-flex align-items-center justify-content-center rounded-circle bg-secondary text-white fw-bold"
             style="width: 36px; height: 36px; font-size: 1rem;">
          <span th:text="${#strings.substring(navbarUser.username, 0, 1).toUpperCase()}">U</span>
        </div>
        <span class="ms-2 text-dark" th:text="${navbarUser.username}">username</span>
      </a>
      <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarUserDropdown">
        <li><a class="dropdown-item" th:href="@{/profile}">Profile</a></li>
        <li><a class="dropdown-item" th:href="@{/profile/sessions}">Sessions</a></li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="dropdown-item">Sign out</button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</nav>
<script th:if="${navbarUser != null}" th:src="@{/js/navbar.js}"></script>
</body>
</html>
