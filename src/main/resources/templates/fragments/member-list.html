<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<!-- Default member list (no room selected) -->
<div th:fragment="member-list" class="member-list p-3 border-start bg-white h-100 overflow-auto">
  <h6 class="text-uppercase text-muted small mb-3">Room info</h6>
  <p class="small text-muted">Select a room to see details</p>

  <hr>

  <h6 class="text-uppercase text-muted small mb-2">Members</h6>
  <ul class="list-unstyled">
    <li class="text-muted small">No members</li>
  </ul>
</div>

<!-- Member list for a specific room -->
<div th:fragment="member-list-room(members, room, currentUser)"
     class="member-list p-3 border-start bg-white h-100 overflow-auto">
  <h6 class="text-uppercase text-muted small mb-1">Room info</h6>
  <p class="small fw-bold mb-0" th:text="${displayName != null ? displayName : room.name}">Room</p>
  <p class="small text-muted" th:text="${room.description}">Description</p>
  <span class="badge bg-light text-dark" th:text="${room.visibility}">PUBLIC</span>
  <!-- Explicit owner line so ownership is visible without scanning the member list (R3-06) -->
  <p class="small text-muted mb-0 mt-1" th:if="${room.visibility.name() != 'DIRECT'}">
    Owner: <span th:text="${room.owner.displayName != null ? room.owner.displayName : room.owner.username}">owner</span>
  </p>

  <hr>

  <h6 class="text-uppercase text-muted small mb-2">
    Members <span class="badge bg-secondary" id="member-count" th:text="${#lists.size(members)}">0</span>
  </h6>
  <ul class="list-unstyled" id="member-list-items">
    <li th:each="member : ${members}" class="d-flex align-items-center py-1">
      <span class="presence-dot me-2 bg-secondary" role="img"
            th:attr="data-user-id=${member.userId}" title="Offline" aria-label="Offline"
            style="width: 8px; height: 8px; border-radius: 50%; display: inline-block;"></span>
      <span class="flex-grow-1 text-truncate" th:text="${member.displayName ?: member.username}">User</span>
      <span class="badge bg-primary ms-1" th:if="${member.role.name() == 'OWNER'}">Owner</span>
      <span class="badge bg-info ms-1" th:if="${member.role.name() == 'ADMIN'}">Admin</span>
      <!-- Every member can befriend/block another user; moderation stays admin-gated (R3-02) -->
      <div class="dropdown ms-1" th:if="${member.userId != currentUser.id}">
        <button class="btn btn-sm btn-outline-secondary dropdown-toggle p-0 px-1" type="button"
                data-bs-toggle="dropdown" aria-expanded="false" title="Actions">
          ⋮
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li>
            <button class="dropdown-item small" type="button"
                    th:attr="data-username=${member.username}"
                    onclick="addFriend(this)">
              Add friend
            </button>
          </li>
          <li>
            <button class="dropdown-item small text-danger" type="button"
                    th:attr="data-user-id=${member.userId},data-username=${member.username}"
                    onclick="blockUser(this)">Block user</button>
          </li>
          <th:block th:if="${currentUserRole != null and (currentUserRole.name() == 'OWNER' or currentUserRole.name() == 'ADMIN')}">
            <li><hr class="dropdown-divider"></li>
            <li>
              <button class="dropdown-item small" type="button"
                      th:attr="data-user-id=${member.userId},data-username=${member.username}"
                      onclick="kickMember(this)">
                Remove from room
              </button>
            </li>
            <li>
              <button class="dropdown-item small" type="button"
                      th:attr="data-user-id=${member.userId},data-username=${member.username}"
                      onclick="banMember(this)">
                Ban from room
              </button>
            </li>
            <li th:if="${member.role.name() == 'MEMBER'}">
              <button class="dropdown-item small" type="button"
                      th:attr="data-user-id=${member.userId}"
                      onclick="promoteToAdmin(this)">
                Promote to Admin
              </button>
            </li>
            <li th:if="${member.role.name() == 'ADMIN'}">
              <button class="dropdown-item small" type="button"
                      th:attr="data-user-id=${member.userId}"
                      onclick="demoteToMember(this)">
                Demote to Member
              </button>
            </li>
          </th:block>
        </ul>
      </div>
    </li>
  </ul>

  <div class="mt-3">
    <button th:if="${currentUserRole != null and (currentUserRole.name() == 'OWNER' or currentUserRole.name() == 'ADMIN')}"
            class="btn btn-outline-primary btn-sm w-100 mb-2"
            data-bs-toggle="modal" data-bs-target="#manageRoomModal">Manage Room</button>
    <!-- Direct messages cannot be left (server returns 403), so don't offer the button there (R5-14) -->
    <button th:if="${room.owner.id != currentUser.id and room.visibility.name() != 'DIRECT'}"
            class="btn btn-outline-warning btn-sm w-100 mb-2"
            onclick="leaveRoom()">Leave room</button>
  </div>
</div>
</body>
</html>
