<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<div th:fragment="sidebar" class="sidebar p-3 border-end bg-white h-100 overflow-auto">
  <div class="mb-3">
    <input type="text" class="form-control form-control-sm" placeholder="Search rooms...">
  </div>

  <div class="accordion" id="roomsAccordion">
    <!-- Public Rooms -->
    <div class="accordion-item border-0">
      <h2 class="accordion-header">
        <button class="accordion-button py-2 px-0 bg-transparent" type="button"
                data-bs-toggle="collapse" data-bs-target="#publicRooms"
                aria-expanded="true" aria-controls="publicRooms">
          Public Rooms
        </button>
      </h2>
      <div id="publicRooms" class="accordion-collapse collapse show">
        <div class="accordion-body p-0">
          <ul class="list-unstyled mb-0" id="public-room-list">
            <li class="px-2 py-1 text-muted small">No rooms yet</li>
          </ul>
        </div>
      </div>
    </div>

    <!-- Private Rooms -->
    <div class="accordion-item border-0">
      <h2 class="accordion-header">
        <button class="accordion-button py-2 px-0 bg-transparent" type="button"
                data-bs-toggle="collapse" data-bs-target="#privateRooms"
                aria-expanded="true" aria-controls="privateRooms">
          Private Rooms
        </button>
      </h2>
      <div id="privateRooms" class="accordion-collapse collapse show">
        <div class="accordion-body p-0">
          <ul class="list-unstyled mb-0" id="private-room-list">
            <li class="px-2 py-1 text-muted small">No rooms yet</li>
          </ul>
        </div>
      </div>
    </div>

    <!-- Direct Messages -->
    <div class="accordion-item border-0">
      <h2 class="accordion-header">
        <button class="accordion-button py-2 px-0 bg-transparent" type="button"
                data-bs-toggle="collapse" data-bs-target="#directMessages"
                aria-expanded="true" aria-controls="directMessages">
          Direct Messages
        </button>
      </h2>
      <div id="directMessages" class="accordion-collapse collapse show">
        <div class="accordion-body p-0">
          <button id="saved-messages-btn" type="button"
                  class="btn btn-outline-secondary btn-sm w-100 mb-2">
            Saved Messages 🔖
          </button>
          <ul class="list-unstyled mb-0" id="direct-chat-list">
            <li class="px-2 py-1 text-muted small">No conversations yet</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <hr>

  <h6 class="text-uppercase text-muted small">Contacts</h6>
  <ul class="list-unstyled mb-3" id="contact-list">
    <li class="px-2 py-1 text-muted small">No contacts yet</li>
  </ul>

  <hr>

  <h6 class="text-uppercase text-muted small">Actions</h6>
  <div class="d-flex gap-2">
    <a th:href="@{/rooms/create}" class="btn btn-outline-primary btn-sm flex-grow-1">Create room</a>
    <a th:href="@{/rooms/catalog}" class="btn btn-outline-secondary btn-sm flex-grow-1">Browse</a>
  </div>

  <div th:if="${currentUserRole != null and currentUserRole.name() == 'MEMBER'}" class="mt-3">
    <div class="dropdown">
      <button class="btn btn-outline-secondary btn-sm dropdown-toggle w-100" type="button"
              id="moreMenuDropdown" data-bs-toggle="dropdown" aria-expanded="false">
        More
      </button>
      <ul class="dropdown-menu" aria-labelledby="moreMenuDropdown">
        <li><a class="dropdown-item" href="#" onclick="blockUser(this); return false;">Block user</a></li>
        <li><a class="dropdown-item" href="#" onclick="addFriend(this); return false;">Add friend</a></li>
      </ul>
    </div>
  </div>
</div>

<!-- Sidebar room item fragment (reusable) -->
<li th:fragment="room-item(room, unreadCount)" class="px-2 py-1 d-flex align-items-center">
  <a th:href="@{/chat/rooms/{id}(id=${room.id})}" class="text-decoration-none text-dark flex-grow-1 text-truncate"
     th:text="${room.name}">Room</a>
  <span th:if="${unreadCount != null and unreadCount > 0}"
        class="badge bg-danger rounded-pill ms-1" th:text="${unreadCount}">0</span>
</li>

<!-- Sidebar contact item fragment (reusable) -->
<li th:fragment="contact-item(username, presenceStatus)" class="px-2 py-1 d-flex align-items-center">
  <span class="presence-dot me-2"
        th:classappend="${presenceStatus == 'ONLINE'} ? 'bg-success' : (${presenceStatus == 'AFK'} ? 'bg-warning' : 'bg-secondary')"
        style="width: 8px; height: 8px; border-radius: 50%; display: inline-block;"></span>
  <span class="text-truncate" th:text="${username}">Username</span>
</li>
</body>
</html>
