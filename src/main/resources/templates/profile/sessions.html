<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sessions - YAC</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/chat.css}">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>
<body class="d-flex flex-column vh-100">

  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <div class="container mt-4">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="mb-0">Active Sessions</h4>
          <a th:href="@{/profile}" class="btn btn-outline-secondary btn-sm">Back to Profile</a>
        </div>

        <div th:if="${sessions.isEmpty()}" class="text-muted">
          <p>No active sessions found.</p>
        </div>

        <div th:each="session : ${sessions}" class="card mb-2">
          <div class="card-body d-flex justify-content-between align-items-center">
            <div>
              <strong>Session</strong>
              <p class="small text-muted mb-0">
                Created: <span th:text="${#temporals.format(session.creationTime(), 'yyyy-MM-dd HH:mm')}">time</span>
                | Last accessed: <span th:text="${#temporals.format(session.lastAccessedTime(), 'yyyy-MM-dd HH:mm')}">time</span>
              </p>
            </div>
            <button class="btn btn-outline-danger btn-sm"
                    th:attr="data-session-id=${session.sessionId()}"
                    onclick="terminateSession(this)">Terminate</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
  <script>
    function terminateSession(btn) {
      var sessionId = btn.getAttribute('data-session-id');
      var csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
      var csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
      var headers = {};
      if (csrfToken && csrfHeader) {
        headers[csrfHeader] = csrfToken;
      }
      fetch('/api/sessions/' + encodeURIComponent(sessionId), {
        method: 'DELETE',
        headers: headers
      }).then(function(resp) {
        if (resp.ok) {
          btn.closest('.card').remove();
        } else {
          alert('Failed to terminate session');
        }
      });
    }
  </script>
</body>
</html>
