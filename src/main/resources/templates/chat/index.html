<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - YAC</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/chat.css}">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>
<body class="d-flex flex-column vh-100">

  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <div class="flex-grow-1 d-flex overflow-hidden">
    <!-- Left sidebar: rooms + contacts -->
    <div class="chat-sidebar" style="width: 260px; min-width: 260px;">
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </div>

    <!-- Center: messages -->
    <div class="flex-grow-1 d-flex flex-column">
      <div class="chat-header border-bottom p-2 bg-white">
        <h6 class="mb-0 text-muted">Select a room to start chatting</h6>
      </div>
      <div th:replace="~{fragments/message-list :: message-list}"></div>
      <div th:replace="~{fragments/message-input :: message-input}"></div>
    </div>

    <!-- Right panel: members -->
    <div class="chat-members" style="width: 220px; min-width: 220px;">
      <div th:replace="~{fragments/member-list :: member-list}"></div>
    </div>
  </div>

  <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
  <script th:src="@{/webjars/github-com-stomp-js-stompjs/stomp.umd.min.js}"></script>
  <script th:src="@{/js/app.js}"></script>
  <script th:src="@{/js/stomp-client.js}"></script>
  <script th:src="@{/js/presence.js}"></script>
  <script th:src="@{/js/sidebar.js}"></script>
  <script th:inline="javascript">
    window.YAC_USER = {
      id: [[${currentUser.id.toString()}]]
    };
  </script>
</body>
</html>
