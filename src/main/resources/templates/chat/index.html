<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>💬</text></svg>">
  <title>Chat - YAC</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/chat.css}">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>
<body class="d-flex flex-column vh-100">

  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <div class="flex-grow-1 d-flex overflow-hidden">
    <!-- Left sidebar: rooms + contacts -->
    <div class="chat-sidebar offcanvas-md offcanvas-start" tabindex="-1" id="sidebarDrawer"
         aria-label="Rooms and contacts" style="width: 260px; min-width: 260px;">
      <button type="button" class="btn-close d-md-none m-2 ms-auto d-block"
              data-bs-dismiss="offcanvas" data-bs-target="#sidebarDrawer" aria-label="Close"></button>
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </div>

    <!-- Center: messages -->
    <div class="flex-grow-1 d-flex flex-column">
      <div class="chat-header border-bottom p-2 bg-white d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-outline-secondary btn-sm d-md-none" type="button"
                  data-bs-toggle="offcanvas" data-bs-target="#sidebarDrawer"
                  aria-controls="sidebarDrawer" title="Rooms &amp; contacts">☰</button>
          <h6 class="mb-0 text-muted">Select a room to start chatting</h6>
        </div>
        <button class="btn btn-outline-secondary btn-sm d-md-none" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#membersDrawer"
                aria-controls="membersDrawer" title="Members">👥</button>
      </div>
      <div th:replace="~{fragments/message-list :: message-list}"></div>
      <!-- No room selected: disabled composer placeholder (R1-81) -->
      <div class="message-input border-top bg-white p-2">
        <div class="d-flex align-items-end gap-2">
          <input type="text" class="form-control form-control-sm"
                 placeholder="Select a room to send messages" disabled>
        </div>
      </div>
    </div>

    <!-- Members panel — off-canvas drawer below md (R2-05) -->
    <div class="chat-members offcanvas-md offcanvas-end" tabindex="-1" id="membersDrawer"
         aria-label="Room members" style="width: 220px; min-width: 220px;">
      <button type="button" class="btn-close d-md-none m-2 ms-auto d-block"
              data-bs-dismiss="offcanvas" data-bs-target="#membersDrawer" aria-label="Close"></button>
      <div th:replace="~{fragments/member-list :: member-list}"></div>
    </div>
  </div>

  <!-- Shared confirm + error modals (R5-09) -->
  <div th:replace="~{fragments/modals :: modals}"></div>

  <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/webjars/github-com-stomp-js-stompjs/stomp.umd.min.js}"></script>
  <script th:src="@{/js/app.js}"></script>
  <script th:src="@{/js/stomp-client.js}"></script>
  <script th:src="@{/js/presence.js}"></script>
  <script th:src="@{/js/sidebar.js}"></script>
  <script th:inline="javascript">
    window.YAC_USER = {
      id: [[${currentUser.id.toString()}]]
    };
  </script>
</body>
</html>
