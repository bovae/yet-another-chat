<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - YAC</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/chat.css}">
</head>
<body class="bg-light">
  <nav class="navbar navbar-light bg-white border-bottom px-3">
    <a class="navbar-brand fw-bold" href="/">YAC</a>
    <div>
      <a th:href="@{/login}" class="btn btn-outline-primary btn-sm me-2">Sign in</a>
      <a th:href="@{/register}" class="btn btn-primary btn-sm">Register</a>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h4 class="card-title text-center mb-4">Register</h4>

            <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">Error</div>

            <form th:action="@{/register}" method="post">
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email"
                       th:value="${email}" required autofocus>
              </div>
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username"
                       th:value="${username}" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
              </div>
              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm password</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Create account</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
