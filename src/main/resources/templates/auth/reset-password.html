<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>💬</text></svg>">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>Reset Password - YAC</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/chat.css}">
</head>
<body class="bg-light">
  <nav class="navbar navbar-light bg-white border-bottom px-3">
    <a class="navbar-brand fw-bold" href="/">YAC</a>
    <div>
      <a th:href="@{/login}" class="btn btn-outline-primary btn-sm me-2">Sign in</a>
      <a th:href="@{/register}" class="btn btn-primary btn-sm">Register</a>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h4 class="card-title text-center mb-4">Reset Password</h4>

            <div id="success-message" class="alert alert-success d-none" role="alert"></div>
            <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

            <form id="reset-password-form">
              <div class="mb-3">
                <label for="token" class="form-label">Reset Token</label>
                <input type="text" class="form-control" id="token" name="token"
                       th:value="${token}" required>
              </div>
              <div class="mb-3">
                <label for="newPassword" class="form-label">New Password</label>
                <input type="password" class="form-control" id="newPassword" name="newPassword" required>
              </div>
              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                <div id="password-mismatch" class="text-danger small mt-1 d-none">Passwords do not match.</div>
              </div>
              <button type="submit" class="btn btn-primary w-100">Reset Password</button>
            </form>

            <div class="text-center mt-3">
              <a th:href="@{/login}" class="text-muted small">Back to Sign in</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
  <script>
    (function() {
      var form = document.getElementById('reset-password-form');
      var successEl = document.getElementById('success-message');
      var errorEl = document.getElementById('error-message');
      var mismatchEl = document.getElementById('password-mismatch');

      function showSuccess(msg) {
        successEl.innerHTML = msg;
        successEl.classList.remove('d-none');
        errorEl.classList.add('d-none');
        mismatchEl.classList.add('d-none');
      }

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.classList.remove('d-none');
        successEl.classList.add('d-none');
      }

      form.addEventListener('submit', function(e) {
        e.preventDefault();

        var newPassword = document.getElementById('newPassword').value;
        var confirmPassword = document.getElementById('confirmPassword').value;

        mismatchEl.classList.add('d-none');
        errorEl.classList.add('d-none');

        if (newPassword !== confirmPassword) {
          mismatchEl.classList.remove('d-none');
          return;
        }

        var token = document.getElementById('token').value;
        var csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        var csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

        var headers = {
          'Content-Type': 'application/json'
        };
        headers[csrfHeader] = csrfToken;

        fetch('/api/password/reset', {
          method: 'POST',
          headers: headers,
          body: JSON.stringify({ token: token, new_password: newPassword })
        })
        .then(function(response) {
          if (response.ok) {
            form.classList.add('d-none');
            showSuccess('Your password has been reset successfully. <a href="/login">Sign in</a>');
          } else {
            return response.json().then(function(err) {
              showError(err.message || 'Failed to reset password. Please try again.');
            });
          }
        })
        .catch(function() {
          showError('An unexpected error occurred. Please try again.');
        });
      });
    })();
  </script>
</body>
</html>
