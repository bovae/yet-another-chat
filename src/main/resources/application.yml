spring:
  application:
    name: yac

  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:yac}
    username: ${DB_USER:yac}
    password: ${DB_PASSWORD:yac}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        "[default_schema]": public
        jdbc:
          "[time_zone]": UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  session:
    timeout: 30d
    data:
      redis:
        namespace: spring:session:yac

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Explicit prod context so the dev seed (context:dev) never runs in prod or Testcontainers tests.
    contexts: prod

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  thymeleaf:
    cache: true

springdoc:
  packages-to-scan: com.bovae.yac.controller.api

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail:
    from: ${MAIL_FROM:no-reply@yac.local}
  security:
    remember-me-key: ${REMEMBER_ME_KEY}
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:8080}
  file-storage:
    base-path: ${FILE_STORAGE_PATH:./file-storage}
    max-file-size: 20MB
    max-image-size: 3MB

logging:
  # traceId is populated per-request by TraceIdFilter; surfaces in the default console pattern.
  pattern:
    correlation: "[%X{traceId:-}] "
  level:
    root: INFO
    com.bovae: DEBUG
