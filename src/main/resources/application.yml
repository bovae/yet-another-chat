spring:
  application:
    name: yac

  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:yac}
    username: ${DB_USER:yac}
    password: ${DB_PASSWORD:yac}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        "[default_schema]": public
        jdbc:
          "[time_zone]": UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  session:
    timeout: 30d
    data:
      redis:
        namespace: spring:session:yac

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  thymeleaf:
    cache: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  security:
    remember-me-key: ${REMEMBER_ME_KEY:change-me-in-production}
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:8080}
  file-storage:
    base-path: ${FILE_STORAGE_PATH:./file-storage}
    max-file-size: 20MB
    max-image-size: 3MB

logging:
  level:
    root: INFO
    com.bovae: DEBUG
